
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FounderNest | Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080b14;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center,
        #172448 0%, #080b14 65%);
      z-index: 10;
      animation: introExit 1s ease 5s forwards;
    }

    .logo {
      width: 100px;
      height: 100px;
      border: 2px solid #91a7ff;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: 55px;
      color: #a9b8ff;
      box-shadow: 0 0 45px #536dfe55;
      opacity: 0;
      transform: scale(0.3) rotate(-20deg);
      animation: logoReveal 1s ease-out 0.3s forwards;
    }

    .brand {
      margin-top: 28px;
      font-size: clamp(32px, 7vw, 54px);
      font-weight: 800;
      letter-spacing: 3px;
      opacity: 0;
      transform: translateY(20px);
      animation: textReveal 1s ease 1.2s forwards;
    }

    .brand span {
      color: #91a7ff;
    }

    .tagline {
      margin-top: 14px;
      color: #b8c1d9;
      font-size: 14px;
      letter-spacing: 3px;
      text-align: center;
      opacity: 0;
      animation: textReveal 1s ease 2s forwards;
    }

    .line {
      width: 0;
      height: 2px;
      margin-top: 30px;
      background: #91a7ff;
      animation: lineGrow 1s ease 2.6s forwards;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .home h1 {
      font-size: clamp(38px, 8vw, 65px);
      margin-bottom: 16px;
    }

    .home h1 span {
      color: #91a7ff;
    }

    .home p {
      color: #b8c1d9;
      line-height: 1.7;
      max-width: 440px;
    }

    .home button {
      margin-top: 30px;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: #91a7ff;
      color: #080b14;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .home button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px #91a7ff55;
    }

    .home {
      animation: homeReveal 0.8s ease 5.2s both;
    }

    @keyframes logoReveal {
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineGrow {
      to { width: 160px; }
    }

    @keyframes introExit {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes homeReveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <section class="intro">
    <div class="logo">⌘</div>

    <div class="brand">
      Founder<span>Nest</span>
    </div>

    <p class="tagline">WHERE IDEAS FIND TEAMS</p>

    <div class="line"></div>
  </section>

  <main class="home">
    <h1>Build Your <span>Future.</span></h1>

    <p>
      Connect with founders, discover talented builders,
      and turn your ideas into real projects.
    </p>

    <button onclick="welcomeUser()">
      Get Started →
    </button>
  </main>

  <script>
    function welcomeUser() {
      alert("Welcome to FounderNest! Your journey starts here.");
    }
  </script>
</body>
</html>
